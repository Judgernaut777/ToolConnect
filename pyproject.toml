[project]
name = "toolconnect"
version = "0.1.0"
description = "Protocol-neutral tool governance: registry, policy decisions, audit. Not an execution engine."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    # Policy decision point. Apache-2.0, in-process, prebuilt aarch64 wheels.
    # Community-maintained binding to AWS Cedar — pinned deliberately.
    "cedarpy>=4.8.6,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
toolconnect = "toolconnect.cli:main"

[build-system]
# >=1.27 is the floor for PEP 639 SPDX license expressions + license-files.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolconnect"]
