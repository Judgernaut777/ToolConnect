[project]
name = "toolconnect"
version = "0.1.0"
description = "Protocol-neutral tool governance: registry, policy decisions, audit. Not an execution engine."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    # Policy decision point. Apache-2.0, in-process, prebuilt aarch64 wheels.
    # Community-maintained binding to AWS Cedar — pinned deliberately.
    "cedarpy>=4.8.6,<5",
    # Offline Ed25519 verification of Connect-Governance execution grants (R5).
    # Used only by toolconnect.govgrants — the vendored, clock-free verifier
    # that redeems governance grants at the point of effect.
    "cryptography>=42",
]

[project.optional-dependencies]
# pyyaml: two registry/audit tests load YAML fixtures and silently skip without
# it (independent-verifier finding, R7). Declared so `pip install -e .[dev]`
# runs the full suite.
dev = ["pytest>=8", "hypothesis>=6", "pyyaml>=6"]

[project.scripts]
toolconnect = "toolconnect.cli:main"

[build-system]
# >=1.27 is the floor for PEP 639 SPDX license expressions + license-files.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolconnect"]
